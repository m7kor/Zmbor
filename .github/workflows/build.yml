name: build

on: [push, pull_request]

jobs:
  linux-gcc-clang:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev xvfb

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
            export CXX=g++
          else
            export CC=clang
            export CXX=clang++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        run: ./build/ps2xTest/ps2x_tests

      - name: Floating-point build guard and probe lab self-test
        run: |
          ctest --test-dir build/ps2xTest -L fpenv --output-on-failure
          ctest --test-dir build/ps2xTest -R "hwprobes_lab_selftest|compat_matrix_selftest" --output-on-failure

      - name: End-to-end (generated ELF -> ps2_recomp -> runtime)
        run: xvfb-run -a ctest --test-dir build/ps2xTest -R "^e2e_(basic|branchdelay|vu_macro)$" --output-on-failure

      - name: VU1 workload correctness (output vs integer reference; timings informational)
        run: ./build/ps2xTest/bench/ps2x_bench_vu1 5 256 && ./build/ps2xTest/bench/ps2x_bench_vu1 5 200 xgkick

      - name: Lane loop compiler probe (informational)
        run: ./build/ps2xTest/fpenv/ps2x_lane_loop_probe || echo "lane loop probe reproduced the pattern (informational, not a failure)"

  # Status dashboard (docs/status): the inventory's evidence links and measurements must be consistent, and the
  # SVGs, docs/status/README.md and the README block must equal what components.json generates. Statuses are never
  # changed here; a status change is a reviewed edit of components.json.
  status-dashboard:
    name: status-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate inventory and generated files
        run: python3 -I tools/status/validate_dashboard.py

      - name: Validator self-test (each rule rejects a crafted bad inventory)
        run: python3 -I tools/status/validate_dashboard.py --selftest

  # Unit suite, Z3 proofs and the e2e programs (generated code included) under AddressSanitizer + UBSan.
  # Any sanitizer report fails the job (-fno-sanitize-recover=all, halt_on_error).
  linux-clang-sanitizers:
    name: linux-clang-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config xvfb
          python3 -m pip install --user z3-solver

      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 -DPS2X_SANITIZE=address,undefined \
            -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_FFMPEG=OFF

      - name: Build
        run: cmake --build build

      - name: Tests under ASan + UBSan
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/ps2xTest/ps2x_tests

      - name: Z3 integer proofs (must run, not skip)
        run: |
          python3 -E tools/semantics/z3_int_semantics.py

      - name: End-to-end under ASan + UBSan
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: xvfb-run -a ctest --test-dir build/ps2xTest -R "^e2e_(basic|branchdelay|vu_macro)$" --output-on-failure

  # Bounded libFuzzer smoke run of every harness in tools/fuzz (60 s each; seeds from tools/fuzz/make_seeds.py plus the minimized regression inputs in tools/fuzz/regressions).
  # A crash or sanitizer report fails the job and leaves the reproducer as an artifact.
  linux-clang-fuzz-smoke:
    name: linux-clang-fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config

      - name: Configure and build fuzzers
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 -DPS2X_SANITIZE=address -DPS2X_BUILD_FUZZERS=ON \
            -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_FFMPEG=OFF -DPS2X_BUILD_TEST=OFF
          cmake --build build --target ps2x_fuzz_gif ps2x_fuzz_vif0 ps2x_fuzz_vif1 ps2x_fuzz_dma ps2x_fuzz_elf ps2x_fuzz_decoder

      - name: Fuzz smoke (60 s per target)
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        run: |
          python3 -I tools/fuzz/make_seeds.py fuzz-seeds
          for t in gif vif0 vif1 dma elf decoder; do
            mkdir -p "fuzz-out/$t" "fuzz-corpus/$t"
            regs=""; [ -d "tools/fuzz/regressions/$t" ] && regs="tools/fuzz/regressions/$t"
            ./build/tools/fuzz/ps2x_fuzz_$t -max_total_time=60 -rss_limit_mb=4096 -artifact_prefix="fuzz-out/$t/" \
              "fuzz-corpus/$t" "fuzz-seeds/$t" $regs
          done

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-reproducers
          path: fuzz-out/

  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_arch: x86_64
    
    name: windows-msvc-${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - uses: lukka/get-cmake@latest

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Tests
        shell: cmd
        run: |
          .\build\ps2xTest\Release\ps2x_tests.exe

      - name: Floating-point build guard and probe lab self-test
        shell: cmd
        run: |
          ctest --test-dir build\ps2xTest -C Release -L fpenv --output-on-failure || exit /b 1
          ctest --test-dir build\ps2xTest -C Release -R "hwprobes_lab_selftest|compat_matrix_selftest" --output-on-failure

      # No end-to-end step here: the hosted Windows runner has no OpenGL driver (WGL), and the runtime opens a window
      # even when hidden. The e2e programs run on the Linux jobs (xvfb + Mesa) and in the local Windows gate.

      - name: VU1 workload correctness (output vs integer reference; timings informational)
        shell: cmd
        run: |
          .\build\ps2xTest\bench\Release\ps2x_bench_vu1.exe 5 256 || exit /b 1
          .\build\ps2xTest\bench\Release\ps2x_bench_vu1.exe 5 200 xgkick

      - name: Lane loop compiler probe (informational)
        shell: cmd
        run: |
          .\build\ps2xTest\fpenv\Release\ps2x_lane_loop_probe.exe || echo lane loop probe reproduced the pattern (informational, not a failure)
          exit /b 0

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: PS2Recomp - Windows
          path: |
            build/ps2xAnalyzer/Release/*.exe
            build/ps2xRecomp/Release/*.exe
            build/ps2xTest/Release/*.exe
